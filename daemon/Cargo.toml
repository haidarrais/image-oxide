[package]
name = "image-oxide-daemon"
version = "0.1.0"
edition = "2021"
description = "image-oxide Rust daemon — per-UID local image processing daemon (specs 001/002/003)"
license = "MIT"
rust-version = "1.70"

[[bin]]
name = "image-oxide"
path = "src/main.rs"

[lib]
name = "image_oxide"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
anyhow = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
