name: Enterprise AI Code Reviewer (PR Agent)

on:
  pull_request:
    # Triggers strictly on pull request activity within the same repository.
    # Fork-based secrets are protected by GitHub's default redaction.
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    # Enables manual tool invocation via comments (e.g., "/improve")
    types: [created, edited]

concurrency:
  # Ensures that subsequent pushes to the same PR cancel redundant, in-flight AI reviews.
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr_agent_job:
    name: "Autonomous Architecture Assessment"
    # STRICT ZERO-TRUST IDENTITY GATE: 
    # Excludes bots and restricts execution solely to trusted organizational identities.
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (
        github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'MEMBER' ||
        github.event.pull_request.author_association == 'COLLABORATOR' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read       # Principle of Least Privilege: Bounded to read-only.
      checks: write        # Required to route output to the GitHub Checks API.
    
    steps:
      - name: PR Agent Execution Engine
        uses: the-pr-agent/pr-agent@main
        env:
          # System Authentication
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Intelligence Routing (Gemini 2026 Stable Ecosystem)
          # Utilizes 3.6 Flash for core reasoning and 3.5 Flash-Lite for high-throughput fallback.
          config.model: "gemini/gemini-3.6-flash"
          config.fallback_models: '["gemini/gemini-3.5-flash-lite"]'
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
          # Workflow Automation Staging
          # Automates descriptive summaries and high-level reviews. Requires manual invocation for inline suggestions.
          github_action_config.auto_describe: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "false" 
          
          # Synchronize Event Handling
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/describe", "/review"]'
          
          # Output and UI/UX Formatting
          # Reroutes monolithic comments to the Checks tab to preserve human conversation flow.
          github.publish_as_check_run: "true"
          config.output_run_details: "true"