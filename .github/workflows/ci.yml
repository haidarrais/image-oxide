name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon-tests:
    name: Daemon tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            daemon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --manifest-path daemon/Cargo.toml --release

      - name: Test
        run: cargo test --manifest-path daemon/Cargo.toml

  # CI-03: cross-compile without C deps (mozjpeg-rs + webp-rust are pure Rust).
  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # CI-03: the encoders are pure-Rust (no C source deps), but every Rust
      # binary still links against libc, and rustc shells out to `cc` for that
      # final link. GitHub runners ship only the host gcc, which cannot link a
      # non-native target — install a cross-linker for aarch64.
      - name: Install cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cross-compile daemon
        run: cargo build --manifest-path daemon/Cargo.toml --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

  # CI-05: NFR benchmark gate — the daemon must stay ahead of GD on resize+compress.
  # Requires the demo layout (laravel-image-oxide-demo + php-image-oxide) beside
  # this repo; run where those co-exist (CI-05 is documented in specs/006).
  benchmark:
    name: NFR benchmark gate (CI-05)
    runs-on: ubuntu-latest
    needs: daemon-tests
    if: false # gated behind the monorepo layout; see specs/006-ci-release.md
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build daemon
        run: cargo build --manifest-path daemon/Cargo.toml --release
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, sockets, json
      - name: Install PHP client + demo
        run: |
          composer install --working-dir php-image-oxide --no-interaction --prefer-dist
          composer install --working-dir laravel-image-oxide-demo --no-interaction --prefer-dist
      - name: Start daemon
        run: |
          daemon/target/release/image-oxide &
          for i in $(seq 1 50); do [ -S /tmp/image-oxide-$(id -u).sock ] && break; sleep 0.2; done
          [ -S /tmp/image-oxide-$(id -u).sock ] || { echo "daemon socket not created"; exit 1; }
      - name: Run benchmark gate
        run: laravel-image-oxide-demo/bench.sh --iters 5
